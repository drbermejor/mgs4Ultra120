; Experimental native 16:9 HUD correction for ultrawide output.
; Disabled by default. The main HUD and menus are centered without stretching,
; but map and Codec auxiliary content can still appear horizontally compressed.
[NativeHUD]
Enabled=0

; Native surfaces which bypass the normal 1280x720 layout converter.
CenterSubtitles=1
CenterMovies=1
CenterTVMovies=1

; Uniformly fits guarded inventory preview routes into the safe canvas.
CenterInventoryPreviews=1

; Keeps the exact verified modal backgrounds output-covering while their text
; and controls remain centered. Unknown states are left unmodified.
ExpandVerifiedFullscreenBackgrounds=1
