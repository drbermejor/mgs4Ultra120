; Native-Windows defaults. This is the same file edited by the Windows GUI.
; Close the game before editing. See docs/MANUAL_INI.md.
[Patch]
UltrawideEnabled=1
; Legacy compatibility key. MGS4Ultra120 no longer writes the game's FPS state.
; The Windows installer uses MGSFPSUnlock for corrected 120 FPS support.
FPSOverrideEnabled=0
AllowUnsupportedExecutable=0

[Ultrawide]
; Width/Height are physical pixels, not DPI-scaled desktop coordinates.
Width=3440
Height=1440
; 1.200 is the tested 21:9 recommendation. Higher values are untested and
; remain the user's responsibility; the patch does not impose an upper limit.
; 1.000 preserves the original vertical FOV but frames Snake more tightly.
FOVMultiplier=1.200
; Experimental native FOV. Set to 0 if it causes instability or a scene-specific
; regression; Hor+ remains active with the game's original vertical FOV.
NativeCameraFOV=1
; Opt-in preview for real-time in-engine cutscenes. Disabled by default.
ExperimentalCinematicFOV=0
; "inherit" uses FOVMultiplier. Advanced testers may enter a separate value.
CinematicFOVMultiplier=inherit
; Internal migration marker. Do not edit.
FOVModelVersion=2

[Supersampling]
; Experimental and disabled by default. Width/Height remain the physical output
; size; RenderScale uniformly increases the internal render resolution.
SupersamplingEnabled=0
RenderScale=1.50

[FPS]
Limit=60
; Legacy compatibility value, ignored by the current MGS4Ultra120 ASI.
; Edit scripts\MGSFPSUnlock.ini to change the improved FPS unlock target.

[Input]
; Opt-in workaround for unwanted controller-to-keyboard profile switching.
; Keep disabled for keyboard/mouse or hybrid controller + mouse/gyro setups.
ControllerProfileFixEnabled=0

[Launcher]
SkipUnityLauncher=1
Region=eu
SelfRegion=EU
Language=en
ControllerType=XBOX
; Windowed uses the primary monitor's full physical size and avoids an
; exclusive display-mode switch. On mixed-refresh NVIDIA multi-monitor systems,
; disable G-SYNC/VRR for MGS4 if focus changes produce a red sweep; Auto HDR
; alone was not the final trigger. See docs/TROUBLESHOOTING_WINDOWS.md.
; Fullscreen is an explicit advanced option.
DisplayMode=Windowed
UsePrimaryPhysicalResolution=1
