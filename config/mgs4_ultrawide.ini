; This is the same configuration edited by the Windows GUI. You may close the
; game, edit these values in a text editor, save, and reopen the GUI later.
; See docs/MANUAL_INI.md for accepted values and a manual-copy installation.
[Patch]
; 1 = enabled, 0 = disabled. The unsupported override can crash after updates.
UltrawideEnabled=1
; Legacy compatibility key. The Windows ASI delegates FPS timing to MGSFPSUnlock.
FPSOverrideEnabled=0
AllowUnsupportedExecutable=0

[Ultrawide]
; Native physical output size. 1.050 is the recommended value and supported
; maximum; 1.000 preserves the original vertical FOV but frames more tightly.
Width=3440
Height=1440
FOVMultiplier=1.050
NativeCameraFOV=1

[Supersampling]
; Experimental and disabled by default. Width/Height remain the physical output
; size; RenderScale uniformly increases the internal render resolution.
SupersamplingEnabled=0
RenderScale=1.15

[FPS]
; Legacy compatibility value, ignored by the current Windows ASI.
Limit=60

[Input]
ControllerProfileFixEnabled=1

[Launcher]
; Default 1 installs the reversible direct wrapper when settings are applied.
SkipUnityLauncher=1
Region=eu
SelfRegion=EU
Language=en
ControllerType=XBOX
