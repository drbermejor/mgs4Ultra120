name: Package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v0.3.4-alpha.7)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-package:
    name: Build and package release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate requested version
        shell: pwsh
        run: |
          $requested = '${{ inputs.version }}'
          $repository = (Get-Content -Raw -LiteralPath VERSION).Trim()
          if ($requested -notmatch '^v\d+\.\d+\.\d+-alpha\.\d+$') {
            throw "Invalid release version: $requested"
          }
          if ($requested -ne $repository) {
            throw "Requested version $requested does not match VERSION $repository."
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Fetch pinned ASI loader
        shell: pwsh
        run: ./scripts/windows/fetch-ultimate-asi-loader.ps1

      - name: Create release archives
        shell: bash
        env:
          MGS4ULTRA120_BIN_DIR: ${{ github.workspace }}/build/bin/Release
          MGS4ULTRA120_ASI_LOADER: ${{ github.workspace }}/build-third-party/ultimate-asi-loader/winmm.dll
        run: ./scripts/package-release.sh '${{ inputs.version }}' all

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = '${{ inputs.version }}'
          $zip = Resolve-Path -LiteralPath "dist/MGS4Ultra120-$version-windows-complete.zip"
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          ./installer/windows/Build-Installer.ps1 `
            -Version $version `
            -WindowsZip $zip `
            -ExpectedZipSha256 $sha256

      - name: Record checksums
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          Get-ChildItem -LiteralPath dist -File |
            Where-Object Name -Like "MGS4Ultra120-$version-*" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii -LiteralPath "dist/SHA256SUMS-$version.txt"

      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: MGS4Ultra120-${{ inputs.version }}-release-candidate
          path: |
            dist/MGS4Ultra120-${{ inputs.version }}-windows-manual.zip
            dist/MGS4Ultra120-${{ inputs.version }}-windows-portable.zip
            dist/MGS4Ultra120-${{ inputs.version }}-windows-16x9-supersampling.zip
            dist/MGS4Ultra120-${{ inputs.version }}-windows-complete.zip
            dist/MGS4Ultra120-${{ inputs.version }}-windows-setup.exe
            dist/MGS4Ultra120-${{ inputs.version }}-linux.tar.gz
            dist/SHA256SUMS-${{ inputs.version }}.txt
          if-no-files-found: error
          retention-days: 14
