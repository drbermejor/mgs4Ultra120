; Experimental native 16:9 HUD correction for ultrawide output.
; Disabled by default. The main HUD and menus are centered without stretching,
; with guarded corrections for the pause map, live Codec feed and Mission
; Briefing compositors. Coverage is intentionally limited to verified routes.
[NativeHUD]
Enabled=0

; Native surfaces which bypass the normal 1280x720 layout converter.
CenterSubtitles=1
CenterMovies=1
CenterTVMovies=1

; Uniformly fits guarded inventory preview routes into the safe canvas.
CenterInventoryPreviews=1

; Corrects the pause-map plane and live markers after the game rebuilds their
; exact native command stream.
CorrectPauseMapAspect=1

; Corrects only the exact auxiliary render target used by the live in-engine
; Codec feed. Static/prerendered Codec content uses the normal centered path.
CorrectCodecRealtimeAspect=1

; Corrects the verified Mission Briefing UI root, persistent owner rectangles
; and four auxiliary child surfaces. Full-output clears remain untouched.
CorrectMissionBriefingAspect=1

; Keeps the exact verified modal backgrounds output-covering while their text
; and controls remain centered. Unknown states are left unmodified.
ExpandVerifiedFullscreenBackgrounds=1
