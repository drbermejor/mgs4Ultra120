; This is the same configuration edited by the Windows GUI. You may close the
; game, edit these values in a text editor, save, and reopen the GUI later.
; See docs/MANUAL_INI.md for accepted values and a manual-copy installation.
[Patch]
; 1 = enabled, 0 = disabled. The unsupported override can crash after updates.
UltrawideEnabled=1
FPSOverrideEnabled=1
AllowUnsupportedExecutable=0

[Ultrawide]
; Native physical output size. FOVMultiplier 1.000 keeps vertical FOV.
Width=3440
Height=1440
FOVMultiplier=1.000
; Experimental D3D12 UI mode; leave 0 for the stable profile.
ConstrainUITo16x9=0

[FPS]
; Limit accepts 30, 60 or experimental 120. Hotkey accepts Off, F1..F24,
; A..Z or 0..9. Modifiers: None or a + combination of Ctrl/Alt/Shift/Win.
Limit=60
ToggleHotkey=F10
ToggleHotkeyModifiers=None

[Input]
ControllerProfileFixEnabled=1

[Launcher]
; Default 1 installs the reversible direct wrapper when settings are applied.
SkipUnityLauncher=1
Region=eu
SelfRegion=EU
Language=en
ControllerType=XBOX
